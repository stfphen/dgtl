<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · DGTL Worklog</title>
<link rel="icon" href="/assets/spark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="auth">
  <div class="auth-card">
    <img class="logo" src="/assets/dgtl-logo.svg" alt="DGTL">
    <h1>Worklog</h1>
    <p class="sub">Sign in to log hours, track work and see where the week went.</p>

    <form id="form" novalidate>
      <div class="field" style="margin-bottom:16px">
        <label class="label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="username"
               autocapitalize="off" spellcheck="false" required>
      </div>
      <div class="field" style="margin-bottom:16px">
        <label class="label" for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="err" id="error" hidden></div>
      <button class="btn btn-primary" id="submit" type="submit">
        Sign in
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <p class="auth-foot">DGTL internal tool · access is by account only</p>
  </div>
</div>

<script type="module">
  import { api } from '/assets/js/api.js';

  const form = document.getElementById('form');
  const error = document.getElementById('error');
  const submit = document.getElementById('submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    error.hidden = true;

    const email = form.email.value.trim();
    const password = form.password.value;
    if (!email || !password) {
      error.textContent = 'Enter your email and password.';
      error.hidden = false;
      return;
    }

    submit.disabled = true;
    submit.style.opacity = '.6';
    try {
      await api.login(email, password);
      window.location.href = '/';
    } catch (err) {
      error.textContent = err.message;
      error.hidden = false;
      form.password.value = '';
      form.password.focus();
      submit.disabled = false;
      submit.style.opacity = '';
    }
  });

  document.getElementById('email').focus();
</script>
</body>
</html>
