<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DGTL OS — terminal.dgtlmedia.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000; --surface-1:#0a0a0a; --surface-2:#111111;
    --border:#2a2a2a; --border-subtle:rgba(255,255,255,0.08);
    --text:#F0F0F0; --text-muted:#D0D0D0; --text-dim:#8a8a8a; --text-ghost:#5a5a56;
    --gold:#F0CF50; --gold-tan:#b3a06a; --gold-tint:rgba(240,207,80,0.08);
    --success:#7BC47F; --info:#6E9FDB; --warn:#E8A33D; --err:#E5484D;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Manrope',ui-sans-serif,system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); font-family:var(--mono);
    font-size:14px; line-height:1.55; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(120% 80% at 50% -10%,rgba(240,207,80,0.05),transparent 60%),
               radial-gradient(100% 60% at 100% 110%,rgba(240,207,80,0.03),transparent 55%);}
  .watermark{position:fixed;right:-4vw;bottom:-6vw;width:52vw;max-width:720px;opacity:.035;
    transform:rotate(-16deg);pointer-events:none;z-index:0;user-select:none}

  .os{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh}
  .topbar{display:flex;align-items:center;gap:14px;padding:11px 18px;
    background:rgba(0,0,0,0.55);backdrop-filter:blur(8px) saturate(1.6);
    border-bottom:1px solid var(--border-subtle);flex-shrink:0}
  .dots{display:flex;gap:8px}
  .dots i{width:12px;height:12px;border-radius:50%;display:block;background:#333}
  .dots i:nth-child(1){background:#E5484D33;box-shadow:inset 0 0 0 1px #E5484D55}
  .dots i:nth-child(2){background:#E8A33D33;box-shadow:inset 0 0 0 1px #E8A33D55}
  .dots i:nth-child(3){background:#7BC47F33;box-shadow:inset 0 0 0 1px #7BC47F55}
  .addr{flex:1;text-align:center;color:var(--text-dim);font-size:12.5px;letter-spacing:.02em}
  .addr b{color:var(--gold-tan);font-weight:500}
  .engine{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.12em;border:1px solid var(--border);
    border-radius:999px;padding:4px 11px;background:var(--surface-2)}
  .engine .edot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);flex-shrink:0}
  .engine.live{color:var(--gold);border-color:rgba(240,207,80,.4)}
  .engine.live .edot{background:var(--success);box-shadow:0 0 8px var(--success);animation:pulse 2.4s infinite}
  .engine.off .edot{background:var(--warn)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .ctxbar{display:flex;gap:0;flex-wrap:wrap;background:var(--surface-2);
    border-bottom:1px solid var(--border);flex-shrink:0;font-size:11.5px}
  .ctx{display:flex;align-items:center;gap:8px;padding:9px 18px;border-right:1px solid var(--border)}
  .ctx .k{color:var(--text-dim);text-transform:uppercase;letter-spacing:.12em;font-size:10px}
  .ctx .v{color:var(--text);font-weight:500}
  .ctx .v.gold{color:var(--gold)}
  .ctx .v.empty{color:var(--text-ghost)}

  .term{flex:1;overflow-y:auto;padding:20px 20px 8px;scroll-behavior:smooth}
  .term::-webkit-scrollbar{width:9px}
  .term::-webkit-scrollbar-thumb{background:#1e1e1e;border-radius:9px}
  .line{white-space:pre-wrap;word-break:break-word;margin:1px 0}
  .prompt{color:var(--gold)}
  .path{color:var(--info)}
  .persona-tag{color:var(--gold-tan)}
  .cmd-echo{color:var(--text)}
  .dim{color:var(--text-dim)}
  .muted{color:var(--text-muted)}
  .ok{color:var(--success)}
  .warnc{color:var(--warn)}
  .errc{color:var(--err)}
  .goldc{color:var(--gold)}
  .infoc{color:var(--info)}
  .h{color:var(--text);font-weight:700}

  .banner{color:var(--gold);font-size:clamp(9px,1.7vw,13px);line-height:1.12;
    text-shadow:0 0 18px rgba(240,207,80,.25);margin:2px 0}

  /* thinking indicator */
  .thinking{display:inline-flex;align-items:center;gap:8px}
  .thinking .tdot{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block;
    animation:tbounce 1.2s infinite ease-in-out}
  .thinking .tdot:nth-child(2){animation-delay:.15s}
  .thinking .tdot:nth-child(3){animation-delay:.3s}
  @keyframes tbounce{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

  .panel{border:1px solid var(--border);border-radius:12px;background:var(--surface-1);
    margin:10px 0;overflow:hidden;max-width:860px}
  .panel-h{padding:11px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);
    display:flex;align-items:center;gap:10px;font-family:var(--sans)}
  .panel-h .ey{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-tan)}
  .panel-h .ti{font-weight:700;font-size:15px;color:var(--text);font-family:var(--sans);flex:1}
  .panel-h .livepill{font-family:var(--mono);font-size:10px;color:var(--gold);border:1px solid rgba(240,207,80,.4);
    border-radius:999px;padding:2px 9px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
  .panel-b{padding:14px 16px}
  .answer-body{white-space:pre-wrap;color:var(--text-muted);font-size:13px;line-height:1.62}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px dashed #1c1c1c}
  .kv:last-child{border-bottom:0}
  .kv .kk{color:var(--text-dim)}
  .kv .vv{color:var(--text);text-align:right}
  .kv .vv.g{color:var(--gold);font-weight:700}
  .metrics{display:flex;gap:14px;flex-wrap:wrap}
  .metric{flex:1;min-width:120px;border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;background:var(--surface-2)}
  .metric .n{font-family:var(--sans);font-size:26px;font-weight:800;color:var(--gold);
    font-variant-numeric:tabular-nums}
  .metric .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-top:2px}
  .chip{display:inline-block;background:var(--gold-tint);color:var(--gold);border-radius:999px;
    padding:2px 10px;font-size:11px;margin:2px 4px 2px 0;font-family:var(--sans);font-weight:600}

  .cmdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:7px}
  .cmdgrid button, .suggest button{all:unset;cursor:pointer;font-family:var(--mono);font-size:12.5px;
    color:var(--text-muted);border:1px solid var(--border);border-radius:7px;padding:7px 10px;
    text-align:center;transition:.15s;background:var(--surface-2)}
  .cmdgrid button:hover,.suggest button:hover{color:var(--gold);border-color:var(--gold);
    background:var(--gold-tint);transform:translateY(-1px)}

  .inputwrap{flex-shrink:0;border-top:1px solid var(--border);background:rgba(0,0,0,0.6);
    backdrop-filter:blur(6px);padding:12px 18px}
  .suggest{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .suggest .lbl{color:var(--text-dim);font-size:11px;align-self:center;text-transform:uppercase;letter-spacing:.1em;margin-right:4px}
  .irow{display:flex;align-items:center;gap:10px}
  .irow .ps{color:var(--gold);font-weight:700;white-space:nowrap}
  .irow .ps .p2{color:var(--info)}
  .irow .ps .p3{color:var(--gold-tan)}
  #cmd{flex:1;background:transparent;border:0;outline:0;color:var(--text);
    font-family:var(--mono);font-size:14px;caret-color:var(--gold)}
  #cmd::placeholder{color:#4a4a4a}
  #cmd:disabled{opacity:.5}
  .hintline{color:var(--text-dim);font-size:11px;margin-top:8px}
  .hintline b{color:var(--gold-tan);font-weight:500}

  .overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);
    backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px}
  .overlay.show{display:flex}
  .modal{width:min(960px,96vw);max-height:90vh;overflow:auto;background:var(--surface-1);
    border:1px solid var(--border);border-radius:16px;font-family:var(--sans);
    box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .modal-top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;
    border-bottom:1px solid var(--border);background:var(--surface-2);position:sticky;top:0;z-index:2}
  .modal-top .mt{font-weight:700}
  .modal-top .mt small{color:var(--text-dim);font-weight:500;margin-left:8px;font-family:var(--mono);font-size:11px}
  .xbtn{all:unset;cursor:pointer;color:var(--text-dim);border:1px solid var(--border);border-radius:7px;
    padding:5px 11px;font-size:12px;font-family:var(--mono)}
  .xbtn:hover{color:var(--gold);border-color:var(--gold)}
  .modal-body{padding:0}

  .lp-hero{padding:52px 40px;background:
     radial-gradient(90% 70% at 50% -10%,rgba(240,207,80,.10),transparent 60%),var(--bg)}
  .lp-ey{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-tan);margin-bottom:14px}
  .lp-h1{font-size:clamp(30px,5vw,52px);font-weight:700;letter-spacing:-1.2px;line-height:1.05}
  .lp-h1 span{color:var(--gold)}
  .lp-sub{color:var(--text-muted);max-width:520px;margin:18px 0 26px;font-size:16px;line-height:1.6}
  .lp-cta{display:inline-block;background:var(--gold);color:#000;font-weight:700;border-radius:7px;
    padding:14px 24px;font-size:14px}
  .lp-cta.ghost{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.4);margin-left:10px}
  .lp-stats{display:flex;gap:20px;padding:26px 40px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex-wrap:wrap}
  .lp-stat .n{font-size:40px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  .lp-stat .l{color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
  .lp-sec{padding:34px 40px}
  .lp-sec h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-tan);margin-bottom:18px}
  .lp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
  .lp-card{border:1px solid var(--border);border-radius:16px;padding:20px;background:rgba(0,0,0,0.45)}
  .lp-card h4{font-size:17px;margin-bottom:8px}
  .lp-card p{color:var(--text-muted);font-size:13.5px;line-height:1.55}

  .deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:22px}
  .slide{aspect-ratio:16/9;border:1px solid var(--border);border-radius:12px;background:var(--bg);
    padding:18px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;
    background:radial-gradient(circle,rgba(240,207,80,.10),transparent 70%)}
  .slide .sn{font-size:10px;color:var(--text-dim);letter-spacing:.1em}
  .slide .st{font-size:17px;font-weight:700;line-height:1.15}
  .slide .st b{color:var(--gold)}
  .slide .sd{font-size:11.5px;color:var(--text-muted)}
  .slide.cover{background:radial-gradient(80% 80% at 20% 0%,rgba(240,207,80,.12),transparent),var(--bg)}
  .slide.cover .st{font-size:22px}

  .an-wrap{padding:24px}
  .an-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){.an-grid{grid-template-columns:1fr}}
  .an-card{border:1px solid var(--border);border-radius:16px;padding:18px;background:var(--surface-1)}
  .an-card .cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-tan)}
  .an-card .big{font-size:34px;font-weight:800;color:var(--gold);margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .an-card .delta{font-size:12px;color:var(--success)}
  svg .grid{stroke:#1c1c1c;stroke-width:1}

  @media(max-width:620px){
    .ctx{padding:8px 12px}
    .term{padding:14px 12px 6px}
    .banner{font-size:8px}
    .metric{min-width:44%}
    .addr{display:none}
    .engine span.etxt{display:none}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>
<div class="vignette"></div>
<img class="watermark" alt="" src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'%3E%3Cpath d='M58 5 L20 70 L45 70 L38 125 L82 52 L54 52 Z' fill='%23F0CF50'/%3E%3C/svg%3E">

<div class="os">
  <div class="topbar">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="addr">— <b>terminal.dgtlmedia.io</b> — secure shell —</div>
    <div class="engine off" id="engine" title="live engine status"><span class="edot"></span><span class="etxt" id="engine-t">detecting…</span></div>
  </div>

  <div class="ctxbar" id="ctxbar">
    <div class="ctx"><span class="k">User</span><span class="v gold">operator</span></div>
    <div class="ctx"><span class="k">Client</span><span class="v empty" id="ctx-client">none</span></div>
    <div class="ctx"><span class="k">Project</span><span class="v empty" id="ctx-project">—</span></div>
    <div class="ctx"><span class="k">Employee</span><span class="v" id="ctx-persona">Chief of Staff</span></div>
    <div class="ctx"><span class="k">Model</span><span class="v" id="ctx-model">dgtl-router</span></div>
  </div>

  <div class="term" id="term"></div>

  <div class="inputwrap">
    <div class="suggest" id="suggest"><span class="lbl">Try</span></div>
    <div class="irow">
      <span class="ps" id="ps">dgtl<span class="p2" id="ps-path"></span><span class="p3" id="ps-persona"></span> ❯</span>
      <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type a command, or ask a question…  (try: help)">
    </div>
    <div class="hintline"><b>research &lt;org&gt;</b> and plain-English questions fire live to the model. <b>Tab</b> autocompletes · <b>↑/↓</b> history · <b>help</b> lists commands · <b>config</b> shows the live engine.</div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
(function(){
  const term=document.getElementById('term');
  const input=document.getElementById('cmd');
  const suggestEl=document.getElementById('suggest');
  const overlay=document.getElementById('overlay');
  const modal=document.getElementById('modal');
  const engineEl=document.getElementById('engine');
  const engineT=document.getElementById('engine-t');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  const state={client:null,project:null,persona:'Chief of Staff',pending:null};
  const history=[]; let hIdx=-1;

  /* ============================================================
     LIVE LLM ADAPTER — auto-detect
     1) window.cowork.askClaude  → fires live inside Cowork (no keys)
     2) a hosted backend endpoint → fires live when deployed
        (holds the API key server-side; see the deploy README)
     ============================================================ */
  function loadEndpoint(){ try{return localStorage.getItem('dgtl_llm_endpoint')||'';}catch(e){return '';} }
  function saveEndpoint(u){ try{ u?localStorage.setItem('dgtl_llm_endpoint',u):localStorage.removeItem('dgtl_llm_endpoint'); }catch(e){} }

  const LLM={
    endpoint: (typeof window!=='undefined' && window.DGTL_LLM_ENDPOINT) || loadEndpoint() || '',
    mode:'offline',
    hasCowork(){ return !!(window.cowork && typeof window.cowork.askClaude==='function'); },
    detect(){ this.mode = this.hasCowork() ? 'cowork' : (this.endpoint ? 'api' : 'offline'); return this.mode; },
    async ask(prompt, system, onChunk){
      // 1) Cowork native inference (one shot)
      if(this.hasCowork()){
        const full = system ? (system + '\n\n— Operator request —\n' + prompt) : prompt;
        const text = normalize(await window.cowork.askClaude(full, []));
        if(onChunk && text) onChunk(text);
        return text;
      }
      // 2) Hosted backend proxy (streams text/plain token-by-token)
      if(this.endpoint){
        const r = await fetch(this.endpoint, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ prompt, system, client: (typeof state!=='undefined' && state.client) ? state.client : null })
        });
        if(!r.ok){ let d={}; try{ d=await r.json(); }catch(e){} throw new Error((d && d.text) ? d.text : ('backend '+r.status+' — check the endpoint / key')); }
        if(r.body && r.body.getReader){
          const reader=r.body.getReader(); const dec=new TextDecoder(); let full='';
          for(;;){ const {done,value}=await reader.read(); if(done) break; const t=dec.decode(value,{stream:true}); if(t){ full+=t; if(onChunk) onChunk(t); } }
          return full;
        }
        const t = await r.text(); if(onChunk) onChunk(t); return t;
      }
      throw new Error('NO_ENGINE');
    }
  };
  function normalize(res){
    if(res==null) return '';
    if(typeof res==='string') return res;
    if(typeof res.text==='string') return res.text;
    if(Array.isArray(res.content)) return res.content.map(c=>c&&c.text?c.text:'').join('');
    if(typeof res.content==='string') return res.content;
    if(typeof res.completion==='string') return res.completion;
    if(res.structuredContent&&res.structuredContent.text) return res.structuredContent.text;
    try{return JSON.stringify(res);}catch(e){return String(res);}
  }
  function engineLabel(){
    return LLM.mode==='cowork' ? 'Cowork live inference'
         : LLM.mode==='api'    ? 'Live API · backend'
         : 'Offline (scripted)';
  }
  function refreshEngine(){
    engineEl.className='engine '+(LLM.mode==='offline'?'off':'live');
    engineT.textContent = LLM.mode==='cowork' ? 'live · cowork'
                        : LLM.mode==='api'    ? 'live · api'
                        : 'offline';
    document.getElementById('ctx-model').textContent = LLM.mode==='offline'?'dgtl-router':'dgtl-router · live';
  }

  /* ---------- mock data (scripted commands) ---------- */
  const CLIENTS={
    ledger:{name:'Ledger',industry:'Fintech / Hardware Wallets',project:'Partnership Proposal',budget:'$75k',stage:'Discovery',
      followers:'1.2M',tone:'security-first, premium',contacts:['VP Brand','Head of Growth']},
    dmtv:{name:'DMTV',industry:'Music / Media Collective',project:'Creator Campaign',budget:'$40k',stage:'Active',
      followers:'480k',tone:'raw, culture-forward',contacts:['Label Mgr','A&R']},
    resort:{name:'Six Senses Ibiza',industry:'Luxury Hospitality',project:'Seasonal Launch',budget:'$120k',stage:'Proposal',
      followers:'2.1M',tone:'serene, aspirational',contacts:['CMO','Events Lead']}
  };
  const CREATORS={
    dmtv:{name:'DMTV',followers:'480k',eng:'6.4%',region:'North America',niche:'Underground music / lifestyle',
      gaps:['No branded merch funnel','Weak email capture','No sponsor deck'],
      sponsors:['Boiler Room','Native Instruments','Red Bull Music','Corona']},
    default:{name:'Creator',followers:'—',eng:'—',region:'—',niche:'—',gaps:[],sponsors:[]}
  };
  const PERSONAS={
    creative:'Creative Director',sales:'Sales Director',web:'Web Developer',
    strategist:'Campaign Strategist',research:'Research Analyst',media:'Media Buyer',
    producer:'Producer',copy:'Copywriter',pm:'Project Manager',cos:'Chief of Staff'
  };
  const NAMESPACES=['agency','creator','sales','client','research','design','video','ugc','social','ops','pitch','proposal','crm','campaign','website','deck','funding','automate'];

  /* ---------- render helpers ---------- */
  function el(html,cls){const d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=html;term.appendChild(d);scroll();return d;}
  function scroll(){term.scrollTop=term.scrollHeight;}
  function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function block(node){term.appendChild(node);scroll();return node;}

  function printPrompt(cmd){
    const path=state.client?`:${state.client}`:'';
    const per=state.persona!=='Chief of Staff'?` (${state.persona.split(' ')[0].toLowerCase()})`:'';
    el(`<span class="prompt">dgtl<span class="path">${path}</span><span class="persona-tag">${per}</span> ❯</span> <span class="cmd-echo">${esc(cmd)}</span>`,'line');
  }

  function stream(lines,done){
    if(reduce){lines.forEach(l=>el(`<span class="${l.c||''}">${l.t}</span>`,'line'));done&&done();return;}
    let i=0;
    (function next(){
      if(i>=lines.length){done&&done();return;}
      const l=lines[i++];
      const d=el('','line');
      const cls=l.c||''; const full=l.t; let j=0;
      d.innerHTML=`<span class="${cls}"></span>`;
      const span=d.firstChild;
      (function type(){
        j=Math.min(full.length,j+Math.max(1,Math.round(full.length/40)));
        span.innerHTML=full.slice(0,j);
        scroll();
        if(j<full.length){setTimeout(type,2.2);}else{setTimeout(next,l.pause||60);}
      })();
    })();
  }

  // typewriter a single plain-text string into a node (used for live answers)
  function typeString(node,text,done){
    text=(text||'').replace(/\r/g,'');
    if(reduce){node.textContent=text;scroll();done&&done();return;}
    let j=0;
    (function t(){
      j=Math.min(text.length,j+Math.max(1,Math.round(text.length/140)));
      node.textContent=text.slice(0,j);scroll();
      if(j<text.length){setTimeout(t,6);}else{done&&done();}
    })();
  }

  function thinkingLine(label){
    return el(`<span class="thinking"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span> <span class="dim">${esc(label)}…</span></span>`,'line');
  }

  /* ---------- the LIVE runner ---------- */
  async function runLive({intro, header, system, prompt, afterSuggest}){
    if(intro) el(`<span class="dim">${intro}</span>`,'line');
    const src = LLM.mode==='cowork'?'Cowork inference':LLM.mode==='api'?'live API':'model';
    const think=thinkingLine('querying '+src);
    input.disabled=true;
    let bodyNode=null;
    function ensurePanel(){
      if(bodyNode) return;
      think.remove();
      const w=document.createElement('div');w.className='panel';
      w.innerHTML=`<div class="panel-h"><span class="ey">${esc(header[0])}</span><span class="ti">${esc(header[1]||'')}</span><span class="livepill">● live</span></div><div class="panel-b"><div class="answer-body"></div></div>`;
      block(w); bodyNode=w.querySelector('.answer-body');
    }
    try{
      const text=await LLM.ask(prompt, system, chunk=>{ ensurePanel(); bodyNode.textContent += chunk; scroll(); });
      if(!bodyNode){ ensurePanel(); bodyNode.textContent = (text||'').trim() || '(empty response)'; }
    }catch(e){
      if(!bodyNode) think.remove();
      if(e.message==='NO_ENGINE'){
        el(`<span class="warnc">○ no live engine.</span> <span class="muted">This build is running offline. To fire live: open it inside <span class="goldc">Cowork</span>, or point it at your backend with <span class="goldc">config endpoint https://your-worker.workers.dev</span> (see the deploy README).</span>`,'line');
      }else{
        el(`<span class="errc">live error:</span> <span class="muted">${esc(e.message)}</span>`,'line');
      }
    }finally{
      input.disabled=false; input.focus();
    }
    if(afterSuggest) setSuggest(afterSuggest);
  }

    if(kind==='research'){
      return base+` Deliver a research brief on the organization the operator names. Cover, briefly: what they do; market positioning; recent notable moves; who their audience is; then 2–3 SPECIFIC angles DGTL could pitch them (creator activation, web/software build, campaigns, DTC scaling, content). If you're unsure of a fact, flag it rather than inventing specifics.`;

  /* ---------- router ---------- */
  function run(raw){
    const cmd=raw.trim();
    printPrompt(cmd);
    input.value='';
    if(!cmd){return;}
    history.unshift(cmd); hIdx=-1;
    if(state.pending){ state.pending(cmd); return; }

    const parts=cmd.split(/\s+/);
    const head=parts[0].toLowerCase();
    const args=parts.slice(1);

    switch(head){
      case 'help': return cmdHelp();
      case 'clear': term.innerHTML=''; return;
      case 'team': return cmdTeam();
      case 'use': return cmdUse(args);
      case 'client': return cmdClient(args);
      case 'context': case 'status': return cmdContext();
      case 'config': return cmdConfig(args);
      case 'ask': return askLive(args.join(' '));
      case 'research': return cmdResearch(args);
      case 'proposal': return cmdProposal(args);
      case 'creator': return cmdCreator(args);
      case 'campaign': return cmdCampaign(args);
      case 'website': return cmdWebsite(args);
      case 'deck': return cmdDeck(args);
      case 'analytics': return cmdAnalytics();
      case 'sales': return cmdSales(args);
      case 'funding': return cmdFunding(args);
      case 'whoami': return el('<span class="muted">operator@dgtl · role: '+esc(state.persona)+' · clearance: full-stack · engine: '+esc(engineLabel())+'</span>','line');
      case 'about': return cmdAbout();
      default:
        if(NAMESPACES.includes(head)){
          stream([{t:`↳ intent recognised: <b>${head}</b> namespace. No subcommand wired — try a specific one, or just ask in plain English (fires live).`,c:'muted'}]);
        } else {
          return askLive(cmd);   // freeform natural-language question → LIVE
        }
    }
  }

              {t:'✓ CRM pipeline       created',c:'ok',pause:35},
              {t:'✓ automation         wired',c:'ok',pause:70},
            ],()=>{
              const w=document.createElement('div');w.className='panel';
              w.innerHTML=`<div class="panel-h"><span class="ey">Campaign Built</span><span class="ti">${esc(theme.charAt(0).toUpperCase()+theme.slice(1))} — ${esc(data.region)}</span></div>
              <div class="panel-b">
                <div class="kv"><span class="kk">Region</span><span class="vv">${esc(data.region)}</span></div>
                <div class="kv"><span class="kk">Budget</span><span class="vv g">${esc(data.budget)}</span></div>
                <div class="kv"><span class="kk">Assets</span><span class="vv">landing · ads · emails · deck · pipeline · automation</span></div>
                <div style="margin-top:12px">${['Landing page','6 ad variants','4-step email seq','Pitch deck','CRM pipeline','Automation'].map(s=>`<span class="chip">${s}</span>`).join('')}</div>
                <div class="cmdgrid" style="margin-top:12px">
                  <button onclick="window.__cmd('website preview')">preview landing</button>
                  <button onclick="window.__cmd('deck preview')">preview deck</button>
                  <button onclick="window.__cmd('ask write 6 ad headlines for this campaign')">✦ live: ad copy</button>
                </div>
              </div>`;
              block(w);
            });
          };
        });
      };
    });
  }

  function cmdSales(args){
    const sub=(args[0]||'').toLowerCase();
    const who=state.client?CLIENTS[state.client].name:'the prospect';
    if(sub==='email'||sub===''){
      stream([{t:'↳ drafting outreach…',c:'dim',pause:110}],()=>{
        const w=document.createElement('div');w.className='panel';
        w.innerHTML=`<div class="panel-h"><span class="ey">Outreach Draft</span><span class="ti">${esc(who)}</span></div>
          <div class="panel-b" style="font-family:var(--sans)">
            <div class="dim" style="font-family:var(--mono);font-size:11px">Subject:</div>
            <div style="color:var(--text);margin-bottom:10px">A creator-led play for ${esc(who)} →</div>
            <div class="muted" style="line-height:1.6">Hi — we build brand-native campaigns that turn audience into pipeline. For ${esc(who)}, we'd pair creator partnerships with a conversion funnel we design, ship, and run end-to-end. Worth 20 minutes to walk you through the plan?</div>
            <div style="margin-top:12px"><span style="background:var(--gold);color:#000;font-weight:700;border-radius:7px;padding:8px 14px;font-size:12px">Book a Call →</span></div>
            <div class="dim" style="margin-top:12px;font-family:var(--mono)">tip: <span class="goldc">ask rewrite this outreach in a punchier tone</span> to fire it live.</div>
          </div>`;
        block(w);
      });
      setSuggest(['ask rewrite that outreach punchier','sales sequence','proposal create']);return;
    }
    stream([{t:`↳ sales.${esc(sub)}() — scripted stub. Try <span class="goldc">ask</span> to generate it live.`,c:'muted'}]);
  }

  function cmdFunding(args){
    stream([
      {t:'↳ funding engine — matching grant + partnership opportunities…',c:'dim',pause:120},
      {t:'✓ 3 opportunities matched to active context',c:'ok',pause:60}
    ],()=>{
      const w=document.createElement('div');w.className='panel';
      w.innerHTML=`<div class="panel-h"><span class="ey">Funding Engine</span><span class="ti">Matched Opportunities</span></div>
        <div class="panel-b">
          <div class="kv"><span class="kk">Tourism Growth Grant</span><span class="vv g">up to $50k</span></div>
          <div class="kv"><span class="kk">Digital Media Fund</span><span class="vv g">up to $35k</span></div>
          <div class="kv"><span class="kk">Creator Economy Pilot</span><span class="vv g">up to $20k</span></div>
          <div class="dim" style="margin-top:10px">↳ roadmap module — ties into lead matching + outreach.</div>
        </div>`;
      block(w);
    });
    setSuggest(['research canada tourism grants','proposal create','sales email']);
  }

  /* ---------- rich preview overlays ---------- */
  function openModal(html){modal.innerHTML=html;overlay.classList.add('show');}
  function closeModal(){overlay.classList.remove('show');}
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

  function cmdWebsite(){
    const name=state.client?CLIENTS[state.client].name:'DGTL Client';
    stream([{t:'↳ website.preview() — rendering live HTML…',c:'dim',pause:120},{t:'✓ opening preview panel',c:'ok'}],()=>{
      openModal(`
        <div class="modal-top"><div class="mt">website preview <small>generated landing · ${esc(name)}</small></div>
          <button class="xbtn" onclick="window.__closeModal()">esc ✕</button></div>
        <div class="modal-body">
          <div class="lp-hero">
            <div class="lp-ey">${esc(name)} × DGTL</div>
            <div class="lp-h1">Turn your audience into <span>pipeline.</span></div>
            <div class="lp-sub">A brand-native campaign engineered end-to-end — creator partnerships, a conversion funnel, and the automation to run it. Built by DGTL.</div>
            <a class="lp-cta">Book a Call →</a><a class="lp-cta ghost">View Work →</a>
          </div>
          <div class="lp-stats">
            <div class="lp-stat"><div class="n">3.2×</div><div class="l">avg. ROAS</div></div>
            <div class="lp-stat"><div class="n">18d</div><div class="l">to launch</div></div>
            <div class="lp-stat"><div class="n">100%</div><div class="l">done-for-you</div></div>
          </div>
          <div class="lp-sec"><h3>What ships</h3>
            <div class="lp-cards">
              <div class="lp-card"><h4>Landing & funnel</h4><p>Conversion-first pages wired to your CRM and checkout.</p></div>
              <div class="lp-card"><h4>Creator activation</h4><p>Matched talent, briefs, and content that actually performs.</p></div>
              <div class="lp-card"><h4>Always-on automation</h4><p>Sequences and pipeline that keep working after launch.</p></div>
            </div>
          </div>
        </div>`);
    });
  }

  function cmdDeck(){
    const name=state.client?CLIENTS[state.client].name:'DGTL';
    stream([{t:'↳ deck.preview() — assembling slides…',c:'dim',pause:120},{t:'✓ 6 slides rendered',c:'ok'}],()=>{
      const slides=[
        {c:'cover',n:'01 · Cover',t:`<b>${esc(name)}</b> × DGTL`,d:'Partnership Proposal'},
        {n:'02 · Opportunity',t:'The <b>opening</b>',d:'Where the audience is, and why now.'},
        {n:'03 · Approach',t:'Creator-led <b>funnel</b>',d:'Talent → content → conversion.'},
        {n:'04 · Deliverables',t:'What we <b>ship</b>',d:'Pages, ads, emails, automation.'},
        {n:'05 · Investment',t:'The <b>numbers</b>',d:'Scoped to budget & goals.'},
        {n:'06 · Next steps',t:'Let\'s <b>build</b>',d:'Book a call →'},
      ];
      openModal(`
        <div class="modal-top"><div class="mt">deck preview <small>${slides.length} slides · ${esc(name)}</small></div>
          <button class="xbtn" onclick="window.__closeModal()">esc ✕</button></div>
        <div class="deck">${slides.map(s=>`<div class="slide ${s.c||''}"><div class="sn">${s.n}</div><div class="st">${s.t}</div><div class="sd">${s.d}</div></div>`).join('')}</div>`);
    });
  }

  function cmdAnalytics(){
    stream([{t:'↳ analytics — opening dashboard…',c:'dim',pause:110}],()=>{
      const pts=[18,30,26,44,40,58,72];
      const w=520,h=150,pad=24,step=(w-pad*2)/(pts.length-1),max=80;
      const path=pts.map((v,i)=>`${i?'L':'M'}${pad+i*step},${h-pad-(v/max)*(h-pad*1.4)}`).join(' ');
      const area=path+` L${pad+(pts.length-1)*step},${h-pad} L${pad},${h-pad} Z`;
      const grid=[0,1,2,3].map(i=>`<line class="grid" x1="${pad}" y1="${pad+i*(h-pad*1.4)/3}" x2="${w-pad}" y2="${pad+i*(h-pad*1.4)/3}"/>`).join('');
      openModal(`
        <div class="modal-top"><div class="mt">analytics <small>projected campaign performance</small></div>
          <button class="xbtn" onclick="window.__closeModal()">esc ✕</button></div>
        <div class="an-wrap">
          <div class="an-grid">
            <div class="an-card"><div class="cap">Reach</div><div class="big">2.4M</div><div class="delta">▲ 38% vs. baseline</div></div>
            <div class="an-card"><div class="cap">Projected ROAS</div><div class="big">3.2×</div><div class="delta">▲ ahead of target</div></div>
          </div>
          <div class="an-card" style="margin-top:16px">
            <div class="cap">Pipeline generated — 7 week ramp</div>
            <svg viewBox="0 0 ${w} ${h}" width="100%" style="margin-top:10px">
              <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#F0CF50" stop-opacity="0.28"/>
                <stop offset="1" stop-color="#F0CF50" stop-opacity="0"/></linearGradient></defs>
              ${grid}
              <path d="${area}" fill="url(#g)"/>
              <path d="${path}" fill="none" stroke="#F0CF50" stroke-width="2.5" stroke-linecap="round"/>
              ${pts.map((v,i)=>`<circle cx="${pad+i*step}" cy="${h-pad-(v/max)*(h-pad*1.4)}" r="3" fill="#F0CF50"/>`).join('')}
            </svg>
          </div>
        </div>`);
    });
  }

  /* ---------- autocomplete ---------- */
  const VERBS={proposal:['create'],creator:['audit','analyze'],client:['open','list'],
    campaign:['build'],sales:['email','sequence','linkedin','followup'],research:['company'],
    use:Object.keys(PERSONAS),website:['preview'],deck:['preview'],config:['endpoint','test','clear']};
  const TOP=NAMESPACES.concat(['help','team','clear','context','analytics','about','whoami','ask','config']);
  function autocomplete(){
    const v=input.value; const parts=v.split(/\s+/);
    if(parts.length===1){
      const m=TOP.filter(n=>n.startsWith(parts[0].toLowerCase()));
      if(m.length===1)input.value=m[0]+' ';
      else if(m.length>1)el('<span class="dim">'+m.join('   ')+'</span>','line');
    } else if(parts.length===2 && VERBS[parts[0]]){
      const m=VERBS[parts[0]].filter(n=>n.startsWith(parts[1].toLowerCase()));
      if(m.length===1)input.value=parts[0]+' '+m[0]+' ';
      else if(m.length>1)el('<span class="dim">'+m.join('   ')+'</span>','line');
    }
  }

  /* ---------- wiring ---------- */
  window.__cmd=function(c){input.value=c;run(c);};
  window.__closeModal=closeModal;
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){run(input.value);}
    else if(e.key==='Tab'){e.preventDefault();autocomplete();}
    else if(e.key==='ArrowUp'){e.preventDefault();if(hIdx<history.length-1){hIdx++;input.value=history[hIdx]||'';}}
    else if(e.key==='ArrowDown'){e.preventDefault();if(hIdx>0){hIdx--;input.value=history[hIdx]||'';}else{hIdx=-1;input.value='';}}
  });
  term.addEventListener('click',()=>{if(!getSelection().toString())input.focus();});
  document.body.addEventListener('click',e=>{if(!e.target.closest('button')&&!e.target.closest('.overlay')&&!getSelection().toString())input.focus();});

  refreshCtx();
  boot();
  setTimeout(()=>input.focus(),200);
})();
</script>
</body>
</html>
