# DGTL report host — two hostnames, one container.
#   dgtl.report/<slug>/        -> /data/reports/<slug>/index.html   (status reports)
#   audit.dgtl.report/<slug>/  -> /data/audits/<slug>/index.html    (client audits)
# The apex ("/") of BOTH hosts serves the baked-in branded placeholder — client
# slugs are never listed publicly (decision 2026-08-10).

map $host $dgtl_root {
    default              /data/reports;
    audit.dgtl.report    /data/audits;
}

server {
    listen 80;
    server_name dgtl.report www.dgtl.report audit.dgtl.report _;
    root $dgtl_root;
    index index.html;

    # Apex: branded placeholder, no directory listing of client slugs.
    location = / {
        root /usr/share/nginx/html;
        try_files /placeholder.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Reports are private-by-URL: keep them out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        root /usr/share/nginx/html;
    }

    # Cache static assets; report pages are versioned by redeploy.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Branded 404 (also catches typos on client slugs).
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Basic hardening.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
