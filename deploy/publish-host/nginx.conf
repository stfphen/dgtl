# DGTL publish host — one container, one hostname per publish destination.
#
#   pitch.dgtl.ltd/<slug>/        -> /data/pitch-ltd/<slug>/index.html   (corporate pitches)
#   shoots.dgtl.gallery/<slug>/   -> /data/gallery/<slug>/index.html     (shoot galleries)
#   sets.dgtl.pics/<slug>/        -> /data/pics/<slug>/index.html        (photo sets)
#   watch.dgtl.mov/<slug>/        -> /data/mov/<slug>/index.html         (video pages)
#
# Subdomains, not apexes, on purpose: dgtl.gallery and dgtl.pics serve their own
# placeholder sites on Hostinger and dgtl.mov serves a live site on this VPS. Taking
# the apexes would have knocked those three offline.
#
# The apex ("/") of every host serves the baked-in branded placeholder — client and
# prospect slugs are never listed publicly (decision 2026-08-10). The one destination
# that DOES publish an index of its slugs is pitch.dgtlmag.com, which is served by the
# older deploy/decks container, not this one.
#
# Adding a destination: add a map line here, a Host() in docker-compose.yml, a volume,
# an entry in deploy/publish-portal/targets.json, and an A record.

map $host $dgtl_root {
    default                /data/pitch-ltd;
    pitch.dgtl.ltd         /data/pitch-ltd;
    shoots.dgtl.gallery    /data/gallery;
    sets.dgtl.pics         /data/pics;
    watch.dgtl.mov         /data/mov;
}

server {
    listen 80;
    server_name pitch.dgtl.ltd shoots.dgtl.gallery sets.dgtl.pics watch.dgtl.mov _;
    root $dgtl_root;
    index index.html;

    # Apex: branded placeholder, no directory listing of slugs.
    location = / {
        root /usr/share/nginx/html;
        try_files /placeholder.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Private-by-URL: keep published pages out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        root /usr/share/nginx/html;
    }

    # Cache static assets; pages are versioned by redeploy.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Branded 404 (also catches typos on slugs).
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Basic hardening.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
