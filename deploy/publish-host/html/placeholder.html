<title>DGTL — Client Reporting</title>

<style>
:root{--bg:#000;--bd:#2a2a2a;--tx:#F0F0F0;--dim:#8a8a8a;--tan:#b3a06a;--gold:#F0CF50}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font-family:Manrope,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(1100px 620px at 82% -10%,rgba(240,207,80,.06),transparent 60%),radial-gradient(900px 600px at -5% 105%,rgba(255,255,255,.03),transparent 55%)}
main{position:relative;z-index:1;text-align:center;padding:32px;max-width:520px}
.bolt{width:54px;height:74px;margin:0 auto 26px;opacity:.9}
.kick{color:var(--tan);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin:0 0 10px}
h1{font-weight:800;font-size:32px;letter-spacing:-.5px;margin:0 0 10px}
h1 span{color:var(--gold)}
p{color:var(--dim);font-size:14px;line-height:1.7;margin:0 0 28px}
a.cta{color:#000;background:var(--gold);text-decoration:none;font-weight:700;font-size:14px;padding:12px 26px;border-radius:7px;display:inline-block}
footer{color:var(--dim);font-size:12px;margin-top:44px;border-top:1px solid var(--bd);padding-top:18px}
</style>
</head>
