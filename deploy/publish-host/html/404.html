<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Not found — DGTL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--bd:#2a2a2a;--tx:#F0F0F0;--dim:#8a8a8a;--tan:#b3a06a;--gold:#F0CF50}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font-family:Manrope,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(1100px 620px at 82% -10%,rgba(240,207,80,.06),transparent 60%)}
main{position:relative;z-index:1;text-align:center;padding:32px;max-width:480px}
.code{font-weight:800;font-size:64px;letter-spacing:-2px;color:var(--gold);margin:0 0 6px}
h1{font-weight:800;font-size:24px;margin:0 0 10px}
p{color:var(--dim);font-size:14px;line-height:1.7;margin:0 0 26px}
a{color:var(--gold);text-decoration:none;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="bg"></div>
<main>
<p class="code">404</p>
<h1>That report isn't here.</h1>
<p>Check the link you were sent — report URLs are exact. If you think this is our mistake, tell your DGTL contact.</p>
<a href="https://dgtlgroup.io">DGTL Group &rarr;</a>
</main>
</body>
</html>
