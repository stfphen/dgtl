server {
    listen 80;
    server_name _;

    # The Journal serves at the DOMAIN ROOT — unlike deploy/decks/, which serves a /pitch subpath.
    # dgtlinfluence.com/            -> /usr/share/nginx/html/index.html
    # dgtlinfluence.com/packs/casper/ -> /usr/share/nginx/html/packs/casper/index.html
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets aggressively; the site is versioned by rebuild.
    #
    # NOTE: nginx's add_header is *replace-not-merge* across levels — a location block with its
    # own add_header drops every add_header inherited from the server block. So the security
    # headers below are repeated here deliberately. Do not "de-duplicate" them.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Branded 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # journal/_headers is a Netlify-style file that nginx does not read. Its two rules are
    # reapplied here so self-hosting matches what the Journal shipped with.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
