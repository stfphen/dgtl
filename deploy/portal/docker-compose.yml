services:
  dgtl-deploy:
    build: .
    image: dgtl-deploy
    container_name: dgtl-deploy
    restart: unless-stopped
    environment:
      DEPLOY_TOKEN: ${DEPLOY_TOKEN:?set DEPLOY_TOKEN in .env}
      PITCH_DIR: /data/pitch
      BASE_URL: https://pitch.dgtlmag.com
    volumes:
      - /opt/dgtl-decks/site/pitch:/data/pitch
    networks:
      - coolify
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"
      traefik.http.routers.dgtl-deploy.rule: "Host(`deploy.dgtlmag.com`)"
      traefik.http.routers.dgtl-deploy.entrypoints: "https"
      traefik.http.routers.dgtl-deploy.tls.certresolver: "letsencrypt"
      traefik.http.routers.dgtl-deploy-http.rule: "Host(`deploy.dgtlmag.com`)"
      traefik.http.routers.dgtl-deploy-http.entrypoints: "http"
      traefik.http.routers.dgtl-deploy-http.middlewares: "deploy-redirect"
      traefik.http.middlewares.deploy-redirect.redirectscheme.scheme: "https"
      traefik.http.services.dgtl-deploy.loadbalancer.server.port: "80"
networks:
  coolify:
    external: true
