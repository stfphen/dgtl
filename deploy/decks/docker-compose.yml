services:
  dgtl-decks:
    build: .
    container_name: dgtl-decks
    restart: unless-stopped
    networks:
      - traefik-public
    # Local-only publish so you can curl the container directly on the VPS while
    # debugging. Traefik reaches it over the traefik-public network, not this port.
    ports:
      - "127.0.0.1:8090:80"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik-public"
      # Dedicated subdomain — apex dgtlgroup.io keeps serving its own homepage, untouched.
      traefik.http.routers.dgtl-decks.rule: "Host(`pitch.dgtlmag.com`)"
      traefik.http.routers.dgtl-decks.entrypoints: "websecure"
      traefik.http.routers.dgtl-decks.tls.certresolver: "letsencrypt"
      traefik.http.services.dgtl-decks.loadbalancer.server.port: "80"

networks:
  # Same external network the app + Traefik already share. Do NOT recreate it.
  traefik-public:
    external: true
