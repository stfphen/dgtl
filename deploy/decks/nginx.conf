server {
    listen 80;
    server_name _;
    # Web root is the /pitch content dir, so decks serve at the SUBDOMAIN ROOT:
    # pitch.dgtlmedia.io/acme-corp/ -> /usr/share/nginx/html/pitch/acme-corp/index.html
    root /usr/share/nginx/html/pitch;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets aggressively; decks are versioned by rebuild.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Branded 404 (also catches typos on deck slugs).
    error_page 404 /404.html;

    # Basic hardening.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
