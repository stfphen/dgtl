<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="archTitle archDesc">
          <title id="archTitle">DGTL Pay non-custodial settlement flow</title>
          <desc id="archDesc">A brand wallet funds an escrow smart contract, which releases to a creator wallet when the milestone is met. A licensed ramp partner handles fiat in and fiat out at the edges. DGTL Pay sits off the money path, connected by dashed instruction lines, and never holds funds.</desc>
          <rect width="960" height="470" fill="#000000"/>
          <defs>
            <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#8a8a8a"/>
            </marker>
            <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#F0CF50"/>
            </marker>
          </defs>

          <!-- ramp boxes -->
          <rect x="30" y="20" width="200" height="58" rx="12" fill="#0a0a0a" stroke="#2a2a2a"/>
          <text x="130" y="45" text-anchor="middle" fill="#F0F0F0" font-family="Manrope,sans-serif" font-size="14.5" font-weight="600">Licensed ramp partner</text>
          <text x="130" y="63" text-anchor="middle" fill="#8a8a8a" font-family="Manrope,sans-serif" font-size="11.5">their licence · their KYC</text>

          <rect x="730" y="20" width="200" height="58" rx="12" fill="#0a0a0a" stroke="#2a2a2a"/>
          <text x="830" y="45" text-anchor="middle" fill="#F0F0F0" font-family="Manrope,sans-serif" font-size="14.5" font-weight="600">Licensed ramp partner</text>
          <text x="830" y="63" text-anchor="middle" fill="#8a8a8a" font-family="Manrope,sans-serif" font-size="11.5">their licence · their KYC</text>

          <!-- ramp arrows -->
          <line x1="130" y1="78" x2="130" y2="144" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ah)"/>
          <text x="142" y="116" fill="#8a8a8a" font-family="Manrope,sans-serif" font-size="12">fiat in</text>
          <line x1="830" y1="144" x2="830" y2="78" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ah)"/>
          <text x="842" y="116" fill="#8a8a8a" font-family="Manrope,sans-serif" font-size="12">fiat out</text>

          <!-- money path nodes -->
          <rect x="30" y="150" width="200" height="86" rx="14" fill="#0a0a0a" stroke="#2a2a2a"/>
          <text x="130" y="186" text-anchor="middle" fill="#F0F0F0" font-family="Manrope,sans-serif" font-size="16.5" font-weight="700">Brand wallet</text>
          <text x="130" y="209" text-anchor="middle" fill="#8a8a8a" font-family="Manrope,sans-serif" font-size="12">brand controls the keys</text>

          <rect x="380" y="150" width="200" height="86" rx="14" fill="#0a0a0a" stroke="#F0CF50" stroke-width="1.4"/>
          <text x="480" y="186" text-anchor="middle" fill="#F0CF50" font-family="Manrope,sans-serif" font-size="16.5" font-weight="700">Escrow contract</text>
          <text x="480" y="209" text-anchor="middle" fill="#8a8a8a" font-family="Manrope,sans-serif" font-size="12">multi-sig release</text>

          <rect x="730" y="150" width="200" height="86" rx="14" fill="#0a0a0a" stroke="#2a2a2a"/>
          <text x="830" y="186" text-anchor="middle" fill="#F0F0F0" font-family="Manrope,sans-serif" font-size="16.5" font-weight="700">Creator wallet</text>
          <text x="830" y="209" text-anchor="middle" fill="#8a8a8a" font-family="Manrope,sans-serif" font-size="12">creator controls the keys</text>

          <!-- money path arrows -->
          <line x1="230" y1="193" x2="374" y2="193" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ah)"/>
          <text x="302" y="180" text-anchor="middle" fill="#D0D0D0" font-family="Manrope,sans-serif" font-size="12.5" font-weight="600">1 · funds escrow</text>
          <text x="302" y="216" text-anchor="middle" fill="#8a8a8a" font-family="Manrope,sans-serif" font-size="11.5">USDC</text>

          <line x1="580" y1="193" x2="724" y2="193" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ah)"/>
          <text x="652" y="180" text-anchor="middle" fill="#D0D0D0" font-family="Manrope,sans-serif" font-size="12.5" font-weight="600">2 · milestone met</text>
          <text x="652" y="216" text-anchor="middle" fill="#8a8a8a" font-family="Manrope,sans-serif" font-size="11.5">USDC</text>

          <!-- DGTL Pay off the money path -->
          <rect x="330" y="360" width="300" height="80" rx="14" fill="#0a0a0a" stroke="#2a2a2a"/>
          <text x="480" y="394" text-anchor="middle" fill="#F0F0F0" font-family="Manrope,sans-serif" font-size="16.5" font-weight="700">DGTL Pay</text>
          <text x="480" y="416" text-anchor="middle" fill="#8a8a8a" font-family="Manrope,sans-serif" font-size="12">arbiter and system of record</text>

          <!-- dashed instruction lines -->
          <line x1="480" y1="360" x2="480" y2="322" stroke="#2a2a2a" stroke-width="1.6" stroke-dasharray="5 5"/>
          <line x1="480" y1="290" x2="480" y2="240" stroke="#2a2a2a" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ah)"/>
          <text x="480" y="309" text-anchor="middle" fill="#F0CF50" font-family="Manrope,sans-serif" font-size="12.5" font-weight="700">instructs · verifies · reconciles — never holds</text>

          <line x1="380" y1="360" x2="132" y2="242" stroke="#2a2a2a" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ah)"/>
          <text x="236" y="332" text-anchor="middle" fill="#8a8a8a" font-family="Manrope,sans-serif" font-size="11.5">invoices · reports</text>

          <line x1="580" y1="360" x2="828" y2="242" stroke="#2a2a2a" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ah)"/>
          <text x="724" y="332" text-anchor="middle" fill="#8a8a8a" font-family="Manrope,sans-serif" font-size="11.5">verifies delivery</text>

          <!-- legend -->
          <line x1="330" y1="459" x2="358" y2="459" stroke="#8a8a8a" stroke-width="1.8"/>
          <text x="366" y="463" fill="#8a8a8a" font-family="Manrope,sans-serif" font-size="11.5">money path</text>
          <line x1="470" y1="459" x2="498" y2="459" stroke="#2a2a2a" stroke-width="1.8" stroke-dasharray="5 5"/>
          <text x="506" y="463" fill="#8a8a8a" font-family="Manrope,sans-serif" font-size="11.5">instruction path — no funds move here</text>
        </svg>
