# ============================================================================
# nginx-pitch.conf — the two edits that put pitch pages on dgtlgroup.io.
# These are SNIPPETS to merge into your existing vhosts, not standalone files.
# Confirm your real server blocks with detect-setup.sh first.
# ============================================================================

# ─── EDIT 1 · in the dgtlgroup.io server { } block ──────────────────────────
# Add this location ABOVE the `location / { proxy_pass ... }` that forwards to
# Next.js. nginx matches the more specific /pitch/ prefix first, so these pages
# are served straight from disk while everything else still hits the Next app.
#
#   server {
#       server_name dgtlgroup.io www.dgtlgroup.io;
#       ...

    location /pitch/ {
        alias /var/www/dgtl-pitch/;      # must match TARGET_DIR in promote-page.sh
        index index.html;
        # serve <slug>/, add trailing slash, else 404 (never fall through to Next)
        try_files $uri $uri/ $uri/index.html =404;
        add_header X-Robots-Tag "all" always;   # explicitly allow indexing
    }

    # expose the pitch sitemap at a clean path
    location = /pitch/pitch-sitemap.xml {
        alias /var/www/dgtl-pitch/pitch-sitemap.xml;
        default_type application/xml;
    }

#       location / {
#           proxy_pass http://127.0.0.1:3000;   # your existing Next.js proxy
#           ...
#       }
#   }


# ─── EDIT 2 · in the pitch.dgtlmedia.io server { } block ────────────────────
# Include the per-slug 301s that promote-page.sh maintains. Pages you HAVEN'T
# promoted keep serving normally; promoted slugs redirect to the main domain.
#
#   server {
#       server_name pitch.dgtlmedia.io;
#       ...

    include /etc/nginx/snippets/pitch-redirects.conf;   # REDIRECTS_CONF in promote-page.sh

#       location / {
#           ... your existing deploy-serving config ...
#       }
#   }

# After any change:  sudo nginx -t && sudo systemctl reload nginx
#
# ─── Caddy users ────────────────────────────────────────────────────────────
# If detect-setup.sh shows Caddy instead of nginx, the equivalent in the
# dgtlgroup.io site block is:
#     handle_path /pitch/* {
#         root * /var/www/dgtl-pitch
#         file_server
#     }
# and in the pitch.dgtlmedia.io block:  redir /<slug> https://dgtlgroup.io/pitch/<slug>/ permanent
