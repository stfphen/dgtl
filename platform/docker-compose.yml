services:
  content-funnel:
    build:
      # Repo-root context so the image can include the ONE shared Worklog
      # client (apps/worklog/client) that lib/stage4 imports across the
      # monorepo. The root .dockerignore keeps the context lean. Compose still
      # runs from platform/, so the project name, .env, and the ./uploads
      # bind mount are unchanged.
      context: ..
      dockerfile: platform/Dockerfile
    container_name: content-checkout-funnel
    restart: unless-stopped
    environment:
      # Bind Next.js to all interfaces. Docker auto-sets HOSTNAME to the container
      # id, and Next.js 15 binds to it — so without this it listens on only one
      # network IP and Traefik gets a 502. Must be 0.0.0.0. See GO_LIVE_PLAN.md.
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "postgres://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@content-funnel-postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      # Overridable (it was a hardcoded literal, so the VPS .env silently could
      # not change the app's canonical identity). Default keeps today's value.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://dgtlmag.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      # --- Outreach batch sending ---
      OUTREACH_DRY_RUN: ${OUTREACH_DRY_RUN:-}
      OUTREACH_CRON_TOKEN: ${OUTREACH_CRON_TOKEN:-}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
      CORE_EMAIL_TRANSPORT: ${CORE_EMAIL_TRANSPORT:-test}
      CORE_WORKER_TEAM_ID: ${CORE_WORKER_TEAM_ID:-}
      CORE_WORKER_ID: ${CORE_WORKER_ID:-}
      CORE_PRODUCTION_SEND_ENABLED: ${CORE_PRODUCTION_SEND_ENABLED:-false}
      CORE_PRODUCTION_SEND_RELEASE_ID: ${CORE_PRODUCTION_SEND_RELEASE_ID:-}
      CORE_PRODUCTION_SEND_AUTHORIZATION: ${CORE_PRODUCTION_SEND_AUTHORIZATION:-}
      CORE_RATE_POLICY_APPROVED: ${CORE_RATE_POLICY_APPROVED:-}
      CORE_RATE_ACCOUNT_DAILY: ${CORE_RATE_ACCOUNT_DAILY:-25}
      CORE_RATE_DOMAIN_DAILY: ${CORE_RATE_DOMAIN_DAILY:-1}
      CORE_RATE_TEAM_DAILY: ${CORE_RATE_TEAM_DAILY:-50}
      CORE_RATE_BATCH: ${CORE_RATE_BATCH:-10}
      CORE_WORKER_CONCURRENCY: ${CORE_WORKER_CONCURRENCY:-2}
      CORE_RETRY_BACKOFF_BASE_MS: ${CORE_RETRY_BACKOFF_BASE_MS:-60000}
      CORE_RETRY_BACKOFF_MAX_MS: ${CORE_RETRY_BACKOFF_MAX_MS:-3600000}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      CORE_PROVIDER_TEAM_ID: ${CORE_PROVIDER_TEAM_ID:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      # Server-only Invoice Generator bearer credential.
      INVOICE_GENERATOR_API_KEY: ${INVOICE_GENERATOR_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # --- Call transcription (Deepgram primary, OpenAI Whisper fallback) ---
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-}
      # --- Claude / AI (subscription token preferred; API key is fallback) ---
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEAD_RESEARCH_MODEL: ${LEAD_RESEARCH_MODEL:-}
      LEAD_RESEARCH_MAX_WEB_SEARCHES: ${LEAD_RESEARCH_MAX_WEB_SEARCHES:-}
      # --- Telephony (Twilio) — used in Phase 7 ---
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TELEPHONY_WEBHOOK_BASE_URL: ${TELEPHONY_WEBHOOK_BASE_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://dgtlmag.com}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-CA}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Toronto}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_NAME: ${OWNER_NAME:-}
      TEAM_NAME: ${TEAM_NAME:-}
      TEAM_SLUG: ${TEAM_SLUG:-}
      # --- Stage 3 generation worker authentication (web side verifies the token;
      #     the worker itself runs as a separate process, never in this container) ---
      CORE_GENERATION_WORKER_TOKEN: ${CORE_GENERATION_WORKER_TOKEN:-}
      CORE_GENERATION_WORKER_TEAM_ID: ${CORE_GENERATION_WORKER_TEAM_ID:-}
      CORE_GENERATION_WORKER_ID: ${CORE_GENERATION_WORKER_ID:-}
      # --- Stage 4 Worklog bridge (unset = bridge off; never defaults to production) ---
      CORE_WORKLOG_BASE_URL: ${CORE_WORKLOG_BASE_URL:-}
      CORE_WORKLOG_EMAIL: ${CORE_WORKLOG_EMAIL:-}
      CORE_WORKLOG_PASSWORD: ${CORE_WORKLOG_PASSWORD:-}
      CORE_WORKLOG_TEAM_ID: ${CORE_WORKLOG_TEAM_ID:-}
      # --- Stage 6 DGTL.chat provider (unset = chat shows a bounded unavailable state) ---
      CORE_CHAT_PROVIDER: ${CORE_CHAT_PROVIDER:-}
      CORE_CHAT_MODEL: ${CORE_CHAT_MODEL:-}
      # --- Release identity shown by the authenticated health endpoint ---
      CORE_RELEASE_SHA: ${CORE_RELEASE_SHA:-}
      # --- DGTL Pass (docs/operations/dgtl-pass-production-runbook.md) ---
      # Unset PASS_PUBLIC_BASE_URL = passes off: holder pages 404, pass APIs 503.
      # PASS_PUBLIC_BASE_URL is PERMANENT once a pass ships: every QR encodes it.
      PASS_PUBLIC_BASE_URL: ${PASS_PUBLIC_BASE_URL:-}
      PASS_ALLOWED_SCAN_HOSTS: ${PASS_ALLOWED_SCAN_HOSTS:-}
      PASS_CREDENTIAL_SECRETS: ${PASS_CREDENTIAL_SECRETS:-}
      PASS_CREDENTIAL_ACTIVE_KEY: ${PASS_CREDENTIAL_ACTIVE_KEY:-}
      PASSES_DRY_RUN: ${PASSES_DRY_RUN:-true}
      PASSES_DEFAULT_TIMEZONE: ${PASSES_DEFAULT_TIMEZONE:-}
      # Pass SMS (Phase 4) sends through a Twilio Messaging Service.
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      # Apple Wallet: WalletWallet (hosted signing) or DGTL's own certificate.
      PASS_WALLET_PROVIDER: ${PASS_WALLET_PROVIDER:-}
      WALLETWALLET_API_KEY: ${WALLETWALLET_API_KEY:-}
      WALLETWALLET_BRANDING: ${WALLETWALLET_BRANDING:-}
      PASSKIT_TEAM_ID: ${PASSKIT_TEAM_ID:-}
      PASSKIT_PASS_TYPE_ID: ${PASSKIT_PASS_TYPE_ID:-}
      PASSKIT_SIGNER_CERT_B64: ${PASSKIT_SIGNER_CERT_B64:-}
      PASSKIT_SIGNER_KEY_B64: ${PASSKIT_SIGNER_KEY_B64:-}
      PASSKIT_SIGNER_KEY_PASSPHRASE: ${PASSKIT_SIGNER_KEY_PASSPHRASE:-}
      PASSKIT_WWDR_CERT_B64: ${PASSKIT_WWDR_CERT_B64:-}
      # --- Staff Google sign-in (unset = the button is hidden) ---
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_ORIGINS: ${GOOGLE_OAUTH_REDIRECT_ORIGINS:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
    depends_on:
      - content-funnel-postgres
    volumes:
      # Media-library uploads. output:"standalone" snapshots public/ at build
      # time, so runtime uploads must live on a mount or they vanish on rebuild.
      - ./uploads:/app/public/uploads
    networks:
      - coolify
      - content-funnel-internal
    ports:
      - "127.0.0.1:8088:3000"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"
      traefik.http.routers.dgtlmag.rule: "Host(`dgtlmag.com`) || Host(`www.dgtlmag.com`)"
      traefik.http.routers.dgtlmag.entrypoints: "https"
      traefik.http.routers.dgtlmag.tls.certresolver: "letsencrypt"
      traefik.http.routers.dgtlmag-http.rule: "Host(`dgtlmag.com`) || Host(`www.dgtlmag.com`)"
      traefik.http.routers.dgtlmag-http.entrypoints: "http"
      traefik.http.routers.dgtlmag-http.middlewares: "dgtlmag-redirect"
      traefik.http.middlewares.dgtlmag-redirect.redirectscheme.scheme: "https"
      traefik.http.services.dgtlmag.loadbalancer.server.port: "3000"
      # dgtl.chat — the authenticated DGTL OS internal-alpha host. Same container:
      # the root page host-resolves, no tenant claims dgtl.chat, so it lands on
      # /home (login-gated). DNS cutover happens separately; this router is inert
      # until dgtl.chat points at this VPS.
      traefik.http.routers.dgtlchat.rule: "Host(`dgtl.chat`)"
      traefik.http.routers.dgtlchat.entrypoints: "https"
      traefik.http.routers.dgtlchat.tls.certresolver: "letsencrypt"
      traefik.http.routers.dgtlchat.service: "dgtlmag"
      traefik.http.routers.dgtlchat-http.rule: "Host(`dgtl.chat`)"
      traefik.http.routers.dgtlchat-http.entrypoints: "http"
      traefik.http.routers.dgtlchat-http.middlewares: "dgtlmag-redirect"
      traefik.http.routers.dgtlchat-http.service: "dgtlmag"
      # os.dgtl.ltd — the app's future canonical host. Same container and same
      # service; the root page host-resolves and no tenant claims it, so it
      # lands on /home (login-gated). Inert until DNS points os.dgtl.ltd here.
      # The dgtl.ltd APEX is deliberately not routed — it stays free for the
      # corporate placeholder site (sites/_briefs/dgtl-ltd.md).
      traefik.http.routers.dgtlltd.rule: "Host(`os.dgtl.ltd`)"
      traefik.http.routers.dgtlltd.entrypoints: "https"
      traefik.http.routers.dgtlltd.tls.certresolver: "letsencrypt"
      traefik.http.routers.dgtlltd.service: "dgtlmag"
      traefik.http.routers.dgtlltd-http.rule: "Host(`os.dgtl.ltd`)"
      traefik.http.routers.dgtlltd-http.entrypoints: "http"
      traefik.http.routers.dgtlltd-http.middlewares: "dgtlmag-redirect"
      traefik.http.routers.dgtlltd-http.service: "dgtlmag"
      # pass.dgtl.ltd — DGTL Pass holder pages. Every pass QR points here, so
      # it is permanent once passes ship. ONLY the holder routes (/p/*) and
      # the static files they load are routed: the admin, the scanner and the
      # APIs stay on the staff hosts, so a pass link can never be turned into
      # a sign-in page on this host. Anything else is Traefik's 404.
      # Inert until DNS points pass.dgtl.ltd here.
      traefik.http.routers.dgtlpass.rule: "Host(`pass.dgtl.ltd`) && (PathPrefix(`/p/`) || PathPrefix(`/_next/static/`) || Path(`/favicon.ico`) || Path(`/icon.svg`))"
      traefik.http.routers.dgtlpass.entrypoints: "https"
      traefik.http.routers.dgtlpass.tls.certresolver: "letsencrypt"
      traefik.http.routers.dgtlpass.service: "dgtlmag"
      traefik.http.routers.dgtlpass-http.rule: "Host(`pass.dgtl.ltd`)"
      traefik.http.routers.dgtlpass-http.entrypoints: "http"
      traefik.http.routers.dgtlpass-http.middlewares: "dgtlmag-redirect"
      traefik.http.routers.dgtlpass-http.service: "dgtlmag"
    healthcheck:
      # The login page is the cheapest unauthenticated route that proves the
      # Next server is up without touching business data.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/admin/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  content-funnel-postgres:
    image: postgres:17-alpine
    container_name: content-funnel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - content-funnel-postgres-data:/var/lib/postgresql/data
    networks:
      - content-funnel-internal

networks:
  coolify:
    external: true
  content-funnel-internal:
    internal: true

volumes:
  content-funnel-postgres-data:
