services:
  content-funnel:
    build: .
    container_name: content-checkout-funnel
    restart: unless-stopped
    environment:
      # Bind Next.js to all interfaces. Docker auto-sets HOSTNAME to the container
      # id, and Next.js 15 binds to it — so without this it listens on only one
      # network IP and Traefik gets a 502. Must be 0.0.0.0. See GO_LIVE_PLAN.md.
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "postgres://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@content-funnel-postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      PUBLIC_APP_URL: https://dgtlmag.com
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      # --- Outreach batch sending ---
      OUTREACH_DRY_RUN: ${OUTREACH_DRY_RUN:-}
      OUTREACH_CRON_TOKEN: ${OUTREACH_CRON_TOKEN:-}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
      CORE_EMAIL_TRANSPORT: ${CORE_EMAIL_TRANSPORT:-test}
      CORE_WORKER_TEAM_ID: ${CORE_WORKER_TEAM_ID:-}
      CORE_WORKER_ID: ${CORE_WORKER_ID:-}
      CORE_PRODUCTION_SEND_ENABLED: ${CORE_PRODUCTION_SEND_ENABLED:-false}
      CORE_PRODUCTION_SEND_RELEASE_ID: ${CORE_PRODUCTION_SEND_RELEASE_ID:-}
      CORE_PRODUCTION_SEND_AUTHORIZATION: ${CORE_PRODUCTION_SEND_AUTHORIZATION:-}
      CORE_RATE_POLICY_APPROVED: ${CORE_RATE_POLICY_APPROVED:-}
      CORE_RATE_ACCOUNT_DAILY: ${CORE_RATE_ACCOUNT_DAILY:-25}
      CORE_RATE_DOMAIN_DAILY: ${CORE_RATE_DOMAIN_DAILY:-1}
      CORE_RATE_TEAM_DAILY: ${CORE_RATE_TEAM_DAILY:-50}
      CORE_RATE_BATCH: ${CORE_RATE_BATCH:-10}
      CORE_WORKER_CONCURRENCY: ${CORE_WORKER_CONCURRENCY:-2}
      CORE_RETRY_BACKOFF_BASE_MS: ${CORE_RETRY_BACKOFF_BASE_MS:-60000}
      CORE_RETRY_BACKOFF_MAX_MS: ${CORE_RETRY_BACKOFF_MAX_MS:-3600000}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      CORE_PROVIDER_TEAM_ID: ${CORE_PROVIDER_TEAM_ID:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # --- Call transcription (Deepgram primary, OpenAI Whisper fallback) ---
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-}
      # --- Claude / AI (subscription token preferred; API key is fallback) ---
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEAD_RESEARCH_MODEL: ${LEAD_RESEARCH_MODEL:-}
      LEAD_RESEARCH_MAX_WEB_SEARCHES: ${LEAD_RESEARCH_MAX_WEB_SEARCHES:-}
      # --- Telephony (Twilio) — used in Phase 7 ---
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TELEPHONY_WEBHOOK_BASE_URL: ${TELEPHONY_WEBHOOK_BASE_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://dgtlmag.com}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-CA}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Toronto}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_NAME: ${OWNER_NAME:-}
      TEAM_NAME: ${TEAM_NAME:-}
      TEAM_SLUG: ${TEAM_SLUG:-}
      # --- Stage 3 generation worker authentication (web side verifies the token;
      #     the worker itself runs as a separate process, never in this container) ---
      CORE_GENERATION_WORKER_TOKEN: ${CORE_GENERATION_WORKER_TOKEN:-}
      CORE_GENERATION_WORKER_TEAM_ID: ${CORE_GENERATION_WORKER_TEAM_ID:-}
      CORE_GENERATION_WORKER_ID: ${CORE_GENERATION_WORKER_ID:-}
      # --- Stage 4 Worklog bridge (unset = bridge off; never defaults to production) ---
      CORE_WORKLOG_BASE_URL: ${CORE_WORKLOG_BASE_URL:-}
      CORE_WORKLOG_EMAIL: ${CORE_WORKLOG_EMAIL:-}
      CORE_WORKLOG_PASSWORD: ${CORE_WORKLOG_PASSWORD:-}
      CORE_WORKLOG_TEAM_ID: ${CORE_WORKLOG_TEAM_ID:-}
      # --- Stage 6 DGTL.chat provider (unset = chat shows a bounded unavailable state) ---
      CORE_CHAT_PROVIDER: ${CORE_CHAT_PROVIDER:-}
      CORE_CHAT_MODEL: ${CORE_CHAT_MODEL:-}
      # --- Release identity shown by the authenticated health endpoint ---
      CORE_RELEASE_SHA: ${CORE_RELEASE_SHA:-}
    depends_on:
      - content-funnel-postgres
    volumes:
      # Media-library uploads. output:"standalone" snapshots public/ at build
      # time, so runtime uploads must live on a mount or they vanish on rebuild.
      - ./uploads:/app/public/uploads
    networks:
      - coolify
      - content-funnel-internal
    ports:
      - "127.0.0.1:8088:3000"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"
      traefik.http.routers.dgtlmag.rule: "Host(`dgtlmag.com`) || Host(`www.dgtlmag.com`)"
      traefik.http.routers.dgtlmag.entrypoints: "https"
      traefik.http.routers.dgtlmag.tls.certresolver: "letsencrypt"
      traefik.http.routers.dgtlmag-http.rule: "Host(`dgtlmag.com`) || Host(`www.dgtlmag.com`)"
      traefik.http.routers.dgtlmag-http.entrypoints: "http"
      traefik.http.routers.dgtlmag-http.middlewares: "dgtlmag-redirect"
      traefik.http.middlewares.dgtlmag-redirect.redirectscheme.scheme: "https"
      traefik.http.services.dgtlmag.loadbalancer.server.port: "3000"
      # dgtl.chat — the authenticated DGTL OS internal-alpha host. Same container:
      # the root page host-resolves, no tenant claims dgtl.chat, so it lands on
      # /home (login-gated). DNS cutover happens separately; this router is inert
      # until dgtl.chat points at this VPS.
      traefik.http.routers.dgtlchat.rule: "Host(`dgtl.chat`)"
      traefik.http.routers.dgtlchat.entrypoints: "https"
      traefik.http.routers.dgtlchat.tls.certresolver: "letsencrypt"
      traefik.http.routers.dgtlchat.service: "dgtlmag"
      traefik.http.routers.dgtlchat-http.rule: "Host(`dgtl.chat`)"
      traefik.http.routers.dgtlchat-http.entrypoints: "http"
      traefik.http.routers.dgtlchat-http.middlewares: "dgtlmag-redirect"
      traefik.http.routers.dgtlchat-http.service: "dgtlmag"
    healthcheck:
      # The login page is the cheapest unauthenticated route that proves the
      # Next server is up without touching business data.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/admin/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  content-funnel-postgres:
    image: postgres:17-alpine
    container_name: content-funnel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - content-funnel-postgres-data:/var/lib/postgresql/data
    networks:
      - content-funnel-internal

networks:
  coolify:
    external: true
  content-funnel-internal:
    internal: true

volumes:
  content-funnel-postgres-data:
