document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

center;justify-content:center;color:#F0CF50\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"font-size:24px;font-weight:700;margin-top:18px\">Your draft is ready<\u002Fdiv>\n        <div style=\"font-size:15px;color:#8a8a8a;margin-top:10px;line-height:1.55\">We opened an email to <span style=\"color:#F0CF50\">hello@dgtlgroup.io<\u002Fspan> with your message. Hit send and we'll be in touch.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeInquiry }}\" style=\"margin-top:22px;background:#F0CF50;color:#000;border:none;border-radius:7px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer\">Done<\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ ADMIN PANEL ============ -->\n  <sc-if value=\"{{ adminOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;justify-content:flex-end;animation:pnFadeIn .25s ease both\">\n    <div style=\"width:min(620px,100%);height:100%;background:#0a0a0a;border-left:1px solid #2a2a2a;overflow-y:auto\">\n      <div style=\"position:sticky;top:0;z-index:2;background:rgba(10,10,10,.85);backdrop-filter:blur(8px);border-bottom:1px solid #2a2a2a;padding:20px 26px;display:flex;align-items:center;justify-content:space-between\">\n        <div>\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#b3a06a\">Admin<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:700;margin-top:3px\">Edit the network<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleAdmin }}\" style=\"width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid #2a2a2a;border-radius:8px;color:#D0D0D0;cursor:pointer\" style-hover=\"color:#fff\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"padding:22px 26px 40px\">\n        <div style=\"font-size:13px;color:#8a8a8a;line-height:1.55;margin-bottom:18px\">Changes save to this browser instantly. Use <b style=\"color:#D0D0D0\">Export data file<\u002Fb> to download an updated <code style=\"color:#F0CF50\">projects-data.js<\u002Fcode> to commit.<\u002Fdiv>\n\n        <sc-for list=\"{{ adminGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <div style=\"border:1px solid #2a2a2a;border-radius:14px;padding:18px;margin-bottom:16px;background:rgba(255,255,255,.015)\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\">\n              <input value=\"{{ g.name }}\" data-scope=\"group\" data-gi=\"{{ g.gi }}\" data-field=\"name\" sc-camel-on-input=\"{{ onFieldInput }}\" placeholder=\"Cluster name\" style=\"flex:1;background:#111;border:1px solid #2a2a2a;border-radius:7px;padding:9px 12px;color:#F0F0F0;font-size:16px;font-weight:700;outline:none\" style-focus=\"border-color:#F0CF50\">\n              <button data-action=\"del-group\" data-gi=\"{{ g.gi }}\" sc-camel-on-click=\"{{ onAdminAction }}\" title=\"Delete cluster\" style=\"flex-shrink:0;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid #2a2a2a;border-radius:7px;color:#8a8a8a;cursor:pointer\" style-hover=\"color:#E5484D;border-color:#E5484D\">\n                <svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <input value=\"{{ g.tagline }}\" data-scope=\"group\" data-gi=\"{{ g.gi }}\" data-field=\"tagline\" sc-camel-on-input=\"{{ onFieldInput }}\" placeholder=\"Cluster tagline\" style=\"width:100%;background:#111;border:1px solid #2a2a2a;border-radius:7px;padding:8px 12px;color:#D0D0D0;font-size:13px;outline:none;margin-bottom:14px\" style-focus=\"border-color:#F0CF50\">\n\n            <sc-for list=\"{{ g.projects }}\" as=\"p\" hint-placeholder-count=\"2\">\n              <div style=\"border:1px solid #222;border-radius:10px;padding:14px;margin-bottom:10px;background:#0d0d0d\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:9px\">\n                  <input value=\"{{ p.name }}\" data-scope=\"project\" data-gi=\"{{ p.gi }}\" data-pi=\"{{ p.pi }}\" data-field=\"name\" sc-camel-on-input=\"{{ onFieldInput }}\" placeholder=\"Project name\" style=\"flex:1;background:#111;border:1px solid #2a2a2a;border-radius:6px;padding:8px 11px;color:#F0F0F0;font-size:14px;font-weight:600;outline:none\" style-focus=\"border-color:#F0CF50\">\n                  <sc-raw-select value=\"{{ p.status }}\" data-scope=\"project\" data-gi=\"{{ p.gi }}\" data-pi=\"{{ p.pi }}\" data-field=\"status\" sc-camel-on-change=\"{{ onFieldInput }}\" style=\"background:#111;border:1px solid #2a2a2a;border-radius:6px;padding:8px;color:#D0D0D0;font-size:12px;outline:none;cursor:pointer\">\n                    <option value=\"working\">Working<\u002Foption>\n                    <option value=\"delivered\">Delivered<\u002Foption>\n                    <option value=\"in-progress\">In progress<\u002Foption>\n                    <option value=\"needs-finishing\">Needs finishing<\u002Foption>\n                  <\u002Fsc-raw-select>\n                  <button data-action=\"del-project\" data-gi=\"{{ p.gi }}\" data-pi=\"{{ p.pi }}\" sc-camel-on-click=\"{{ onAdminAction }}\" title=\"Delete\" style=\"flex-shrink:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid #2a2a2a;border-radius:6px;color:#8a8a8a;cursor:pointer\" style-hover=\"color:#E5484D;border-color:#E5484D\">\n                    <svg sc-camel-view-box=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n                <input value=\"{{ p.blurb }}\" data-scope=\"project\" data-gi=\"{{ p.gi }}\" data-pi=\"{{ p.pi }}\" data-field=\"blurb\" sc-camel-on-input=\"{{ onFieldInput }}\" placeholder=\"Short description\" style=\"width:100%;background:#111;border:1px solid #2a2a2a;border-radius:6px;padding:8px 11px;color:#D0D0D0;font-size:13px;outline:none;margin-bottom:8px\" style-focus=\"border-color:#F0CF50\">\n                <textarea data-scope=\"project\" data-gi=\"{{ p.gi }}\" data-pi=\"{{ p.pi }}\" data-field=\"detail\" value=\"{{ p.detail }}\" sc-camel-on-change=\"{{ onFieldInput }}\" placeholder=\"Longer detail (optional)\" rows=\"2\" style=\"width:100%;background:#111;border:1px solid #2a2a2a;border-radius:6px;padding:8px 11px;color:#8a8a8a;font-size:13px;outline:none;resize:vertical;margin-bottom:8px\" style-focus=\"border-color:#F0CF50\"><\u002Ftextarea>\n                <input value=\"{{ p.next }}\" data-scope=\"project\" data-gi=\"{{ p.gi }}\" data-pi=\"{{ p.pi }}\" data-field=\"next\" sc-camel-on-input=\"{{ onFieldInput }}\" placeholder=\"What's next (optional)\" style=\"width:100%;background:#111;border:1px solid #2a2a2a;border-radius:6px;padding:8px 11px;color:#D0D0D0;font-size:13px;outline:none;margin-bottom:8px\" style-focus=\"border-color:#F0CF50\">\n                <input value=\"{{ p.link }}\" data-scope=\"project\" data-gi=\"{{ p.gi }}\" data-pi=\"{{ p.pi }}\" data-field=\"link\" sc-camel-on-input=\"{{ onFieldInput }}\" placeholder=\"Live link URL (optional)\" style=\"width:100%;background:#111;border:1px solid #2a2a2a;border-radius:6px;padding:8px 11px;color:#F0CF50;font-size:13px;outline:none\" style-focus=\"border-color:#F0CF50\">\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <button data-action=\"add-project\" data-gi=\"{{ g.gi }}\" sc-camel-on-click=\"{{ onAdminAction }}\" style=\"width:100%;background:transparent;border:1px dashed #2a2a2a;border-radius:8px;padding:10px;color:#8a8a8a;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s ease\" style-hover=\"border-color:#F0CF50;color:#F0CF50\">+ Add project<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <button data-action=\"add-group\" sc-camel-on-click=\"{{ onAdminAction }}\" style=\"width:100%;background:rgba(240,207,80,.06);border:1px solid #2a2a2a;border-radius:10px;padding:13px;color:#F0CF50;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:22px\" style-hover=\"border-color:#F0CF50\">+ Add cluster<\u002Fbutton>\n\n        <div style=\"display:flex;gap:10px;border-top:1px solid #2a2a2a;padding-top:20px\">\n          <button sc-camel-on-click=\"{{ exportData }}\" style=\"flex:1;background:#F0CF50;color:#000;border:none;border-radius:7px;padding:12px;font-size:14px;font-weight:700;cursor:pointer\" style-hover=\"filter:brightness(1.06)\">Export data file<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ revertToFile }}\" style=\"background:transparent;color:#8a8a8a;border:1px solid #2a2a2a;border-radius:7px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"color:#E5484D;border-color:#E5484D\">Revert to file<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F0CF50&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;showStatus&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;starDensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Look&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    view: 'galaxy', focusedGroupId: null,\n    previewOpen: false, previewGroupIdx: null, previewProjIdx: null,\n    entered: false, vw: 0, vh: 0, isMobile: false,\n    adminOpen: false, inquiryOpen: false, inquirySent: false,\n    data: null,\n  };\n\n  GROUP_POS = [\n    { x: 1010, y: 650 }, { x: 2190, y: 660 },\n    { x: 990, y: 1360 }, { x: 2210, y: 1350 },\n  ];\n  WORLD = { w: 3200, h: 2000 };\n  RING = 300;\n  STORAGE_KEY = 'dgtl-project-network-data';\n\n  STATUS = {\n    'working': { c: '#7BC47F', t: 'rgba(123,196,127,.12)', l: 'Working' },\n    'delivered': { c: '#F0CF50', t: 'rgba(240,207,80,.12)', l: 'Delivered' },\n    'in-progress': { c: '#E8A33D', t: 'rgba(232,163,61,.12)', l: 'In progress' },\n    'needs-finishing': { c: '#6E9FDB', t: 'rgba(110,159,219,.12)', l: 'Needs finishing' },\n  };\n\n  componentDidMount() {\n    const base = (typeof window !== 'undefined' && window.PROJECT_DATA)\n      ? JSON.parse(JSON.stringify(window.PROJECT_DATA))\n      : { groups: [], brand: {} };\n    let data = base;\n    try {\n      const saved = localStorage.getItem(this.STORAGE_KEY);\n      if (saved) { const p = JSON.parse(saved); if (p && Array.isArray(p.groups)) data = p; }\n    } catch (e) {}\n    this.setState({ data, vw: window.innerWidth, vh: window.innerHeight, isMobile: window.innerWidth < 760 });\n    this._onResize = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight, isMobile: window.innerWidth < 760 });\n    window.addEventListener('resize', this._onResize);\n    this._onKey = (e) => {\n      const tag = (e.target && e.target.tagName || '').toLowerCase();\n      const typing = tag === 'input' || tag === 'textarea' || tag === 'select';\n      if (e.key === 'Escape') {\n        if (this.state.previewOpen) this.setState({ previewOpen: false });\n        else if (this.state.adminOpen) this.setState({ adminOpen: false });\n        else if (this.state.inquiryOpen) this.setState({ inquiryOpen: false });\n        else if (this.state.view === 'group') this.backToGalaxy();\n      } else if ((e.key === 'a' || e.key === 'A') && !typing) {\n        this.setState(s => ({ adminOpen: !s.adminOpen }));\n      }\n    };\n    window.addEventListener('keydown', this._onKey);\n    this._entTimer = setTimeout(() => this.setState({ entered: true }), 90);\n    this._startStars();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n    window.removeEventListener('keydown', this._onKey);\n    clearTimeout(this._entTimer);\n    if (this._raf) cancelAnimationFrame(this._raf);\n  }\n\n  setCanvas = (el) => { this.canvas = el; if (el) this._startStars(); };\n\n  _startStars() {\n    if (this._raf || !this.canvas) return;\n    const cv = this.canvas;\n    const ctx = cv.getContext('2d');\n    let dpr = Math.min(window.devicePixelRatio || 1, 2);\n    let W = 0, H = 0, stars = [];\n    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;\n    const density = (typeof this.props?.starDensity === 'number' ? this.props.starDensity : 1);\n    const build = () => {\n      W = cv.clientWidth; H = cv.clientHeight;\n      cv.width = Math.max(1, W * dpr); cv.height = Math.max(1, H * dpr);\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      const n = Math.min(220, Math.floor((W * H) / 13000 * density));\n      stars = [];\n      for (let i = 0; i < n; i++) {\n        stars.push({\n          x: Math.random() * W, y: Math.random() * H,\n          z: 0.3 + Math.random() * 0.7, r: 0.5 + Math.random() * 1.4,\n          vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.12,\n        });\n      }\n    };\n    build();\n    this._starBuild = build;\n    const draw = () => {\n      ctx.clearRect(0, 0, W, H);\n      const cam = this._cam || { tx: 0, ty: 0, s: 1 };\n      for (const st of stars) {\n        if (!reduced) { st.x += st.vx * st.z; st.y += st.vy * st.z; }\n        if (st.x < -5) st.x = W + 5; if (st.x > W + 5) st.x = -5;\n        if (st.y < -5) st.y = H + 5; if (st.y > H + 5) st.y = -5;\n        const px = st.x + (cam.tx * 0.018 * st.z);\n        const py = st.y + (cam.ty * 0.018 * st.z);\n        ctx.beginPath();\n        ctx.arc(px, py, st.r, 0, Math.PI * 2);\n        ctx.fillStyle = `rgba(240,207,80,${0.10 + st.z * 0.28})`;\n        ctx.fill();\n      }\n      // faint links between nearby stars\n      ctx.lineWidth = 0.5;\n      for (let i = 0; i < stars.length; i++) {\n        for (let j = i + 1; j < stars.length; j++) {\n          const a = stars[i], b = stars[j];\n          const dx = a.x - b.x, dy = a.y - b.y;\n          const d2 = dx * dx + dy * dy;\n          if (d2 < 12000) {\n            const o = (1 - d2 / 12000) * 0.10;\n            ctx.strokeStyle = `rgba(240,207,80,${o})`;\n            ctx.beginPath();\n            ctx.moveTo(a.x + cam.tx * 0.018 * a.z, a.y + cam.ty * 0.018 * a.z);\n            ctx.lineTo(b.x + cam.tx * 0.018 * b.z, b.y + cam.ty * 0.018 * b.z);\n            ctx.stroke();\n          }\n        }\n      }\n      this._raf = requestAnimationFrame(draw);\n    };\n    let last = 0;\n    const resizeCheck = () => {\n      if (cv.clientWidth !== W || cv.clientHeight !== H) build();\n    };\n    this._resizeCheckTimer = setInterval(resizeCheck, 500);\n    draw();\n  }\n\n  // ---- coordinate helpers ----\n  _groupPos(gi, total) {\n    if (gi < this.GROUP_POS.length) return this.GROUP_POS[gi];\n    const extra = gi - this.GROUP_POS.length;\n    const ring = Math.max(4, total - this.GROUP_POS.length);\n    const ang = (extra / ring) * Math.PI * 2 - Math.PI / 2;\n    return { x: 1600 + Math.cos(ang) * 900, y: 1000 + Math.sin(ang) * 620 };\n  }\n\n  // ---- navigation ----\n  focusGroup(id) { this.setState({ view: 'group', focusedGroupId: id, previewOpen: false }); }\n  backToGalaxy = () => this.setState({ view: 'galaxy', focusedGroupId: null, previewOpen: false });\n  onViewportClick = (e) => {\n    if (e.target === e.currentTarget && this.state.view === 'group' && !this.state.previewOpen) this.backToGalaxy();\n  };\n  onGroupClick = (e) => {\n    e.stopPropagation();\n    const gi = +e.currentTarget.dataset.gi;\n    const g = this.state.data.groups[gi];\n    if (g) this.focusGroup(g.id);\n  };\n  onProjectClick = (e) => {\n    e.stopPropagation();\n    const gi = +e.currentTarget.dataset.gi, pi = +e.currentTarget.dataset.pi;\n    const g = this.state.data.groups[gi];\n    this.setState({ view: 'group', focusedGroupId: g ? g.id : null, previewOpen: true, previewGroupIdx: gi, previewProjIdx: pi });\n  };\n  closePreview = () => this.setState({ previewOpen: false });\n  stop = (e) => e.stopPropagation();\n\n  toggleAdmin = () => this.setState(s => ({ adminOpen: !s.adminOpen }));\n  openInquiry = () => this.setState({ inquiryOpen: true, inquirySent: false });\n  closeInquiry = () => this.setState({ inquiryOpen: false });\n  submitInquiry = (e) => {\n    e.preventDefault();\n    const f = e.target;\n    const name = f.name_.value, email = f.email_.value, msg = f.message_.value;\n    const body = encodeURIComponent(msg + '\\n\\n\\u2014 ' + name + ' (' + email + ')');\n    const subj = encodeURIComponent('New project inquiry \\u2014 ' + name);\n    try { window.location.href = 'mailto:hello@dgtlgroup.io?subject=' + subj + '&body=' + body; } catch (err) {}\n    this.setState({ inquirySent: true });\n  };\n\n  // ---- admin editing ----\n  _persist(data) { try { localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data)); } catch (e) {} }\n  onFieldInput = (e) => {\n    const t = e.target, ds = t.dataset;\n    const data = JSON.parse(JSON.stringify(this.state.data));\n    if (ds.scope === 'group') data.groups[+ds.gi][ds.field] = t.value;\n    else data.groups[+ds.gi].projects[+ds.pi][ds.field] = t.value;\n    this.setState({ data });\n    this._persist(data);\n  };\n  onAdminAction = (e) => {\n    const b = e.currentTarget, ds = b.dataset;\n    const data = JSON.parse(JSON.stringify(this.state.data));\n    const uid = () => Math.random().toString(36).slice(2, 8);\n    if (ds.action === 'add-group') {\n      data.groups.push({ id: 'group-' + uid(), name: 'New cluster', tagline: '', projects: [] });\n    } else if (ds.action === 'del-group') {\n      data.groups.splice(+ds.gi, 1);\n    } else if (ds.action === 'add-project') {\n      data.groups[+ds.gi].projects.push({ id: 'p-' + uid(), name: 'New project', status: 'in-progress', blurb: '', detail: '', next: '', stack: [], link: '', image: '' });\n    } else if (ds.action === 'del-project') {\n      data.groups[+ds.gi].projects.splice(+ds.pi, 1);\n    }\n    this.setState({ data });\n    this._persist(data);\n  };\n  exportData = () => {\n    const json = JSON.stringify(this.state.data, null, 2);\n    const text = '/* DGTL PROJECT NETWORK \\u2014 data file (exported ' + new Date().toISOString().slice(0, 10) + ') */\\nwindow.PROJECT_DATA = ' + json + ';\\n';\n    const blob = new Blob([text], { type: 'text/javascript' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url; a.download = 'projects-data.js';\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n  };\n  revertToFile = () => {\n    try { localStorage.removeItem(this.STORAGE_KEY); } catch (e) {}\n    const base = (window.PROJECT_DATA) ? JSON.parse(JSON.stringify(window.PROJECT_DATA)) : { groups: [] };\n    this.setState({ data: base });\n  };\n\n  renderVals() {\n    const accent = this.props?.accent || '#F0CF50';\n    const showStatus = this.props?.showStatus ?? true;\n    const data = this.state.data || (typeof window !== 'undefined' && window.PROJECT_DATA) || { groups: [], brand: {} };\n    const gs = data.groups || [];\n    const total = gs.length;\n    const vw = this.state.vw || (typeof window !== 'undefined' ? window.innerWidth : 1280) || 1280;\n    const vh = this.state.vh || (typeof window !== 'undefined' ? window.innerHeight : 800) || 800;\n    const entered = this.state.entered;\n    const view = this.state.view;\n    const focusedId = this.state.focusedGroupId;\n\n    // group + project node geometry\n    const positions = gs.map((g, gi) => this._groupPos(gi, total));\n    const groups = gs.map((g, gi) => {\n      const pos = positions[gi];\n      const ac = g.accent || accent;\n      const isFocused = focusedId === g.id;\n      let op = 1;\n      if (view === 'group') op = isFocused ? 1 : 0.22;\n      if (!entered) op = 0;\n      const n = (g.projects || []).length;\n      return {\n        gi, id: g.id, name: g.name || 'Untitled', tagline: g.tagline || '',\n        gx: pos.x, gy: pos.y, accent: ac,\n        tint: this._alpha(ac, 0.16), tintStrong: this._alpha(ac, 0.34), ring: this._alpha(ac, 0.5),\n        op, delay: (entered ? gi * 0.1 : 0),\n        countLabel: n + (n === 1 ? ' project' : ' projects'),\n        projects: (g.projects || []).map((p, pi) => this._projMeta(p, gi, pi, showStatus)),\n      };\n    });\n\n    // flattened project nodes positioned on a ring around their group\n    const projectNodes = [];\n    gs.forEach((g, gi) => {\n      const pos = positions[gi];\n      const ps = g.projects || [];\n      const isFocused = focusedId === g.id;\n      ps.forEach((p, pi) => {\n        const ang = (pi / Math.max(1, ps.length)) * Math.PI * 2;\n        const rad = this.RING;\n        const meta = this._projMeta(p, gi, pi, showStatus);\n        projectNodes.push({\n          ...meta,\n          px: pos.x + Math.cos(ang) * rad,\n          py: pos.y + Math.sin(ang) * rad,\n          op: (view === 'group' && isFocused && entered) ? 1 : 0,\n          pe: (view === 'group' && isFocused) ? 'auto' : 'none',\n          delay: (view === 'group' && isFocused) ? pi * 0.06 : 0,\n          tint: this._alpha(meta.statusColor, 0.18),\n        });\n      });\n    });\n\n    // constellation lines\n    const lines = [];\n    gs.forEach((g, gi) => {\n      const pos = positions[gi];\n      // group -> world centre (structural web)\n      lines.push({ x1: pos.x, y1: pos.y, x2: 1600, y2: 1000, color: accent, w: 1, op: view === 'galaxy' ? 0.1 : 0.04 });\n      const ps = g.projects || [];\n      const isFocused = focusedId === g.id;\n      ps.forEach((p, pi) => {\n        const ang = (pi / Math.max(1, ps.length)) * Math.PI * 2;\n        const rad = this.RING;\n        lines.push({\n          x1: pos.x, y1: pos.y,\n          x2: pos.x + Math.cos(ang) * rad, y2: pos.y + Math.sin(ang) * rad,\n          color: accent, w: 1,\n          op: (view === 'group' && isFocused) ? 0.4 : 0,\n        });\n      });\n    });\n\n    // camera\n    let fx = 1600, fy = 1000, s;\n    if (positions.length) {\n      const xs = positions.map(p => p.x), ys = positions.map(p => p.y);\n      const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);\n      const spanX = (maxX - minX) + 640, spanY = (maxY - minY) + 900;\n      const galaxyScale = this._clamp(Math.min((vw * 0.86) / spanX, (vh * 0.9) / spanY), 0.3, 0.9);\n      const focusScale = this._clamp(Math.min((vw * 0.8) / (this.RING * 2 + 300), (vh * 0.66) / (this.RING * 2 + 340)), 0.85, 1.9);\n      if (view === 'group' && focusedId) {\n        const idx = gs.findIndex(g => g.id === focusedId);\n        if (idx >= 0) { fx = positions[idx].x; fy = positions[idx].y; }\n        s = focusScale;\n      } else {\n        fx = (minX + maxX) / 2; fy = (minY + maxY) / 2; s = galaxyScale;\n      }\n    } else { s = 0.6; }\n    const galaxyYOffset = (view === 'galaxy') ? vh * 0.09 : 0;\n    const tx = vw / 2 - fx * s, ty = vh / 2 - fy * s + galaxyYOffset;\n    this._cam = { tx, ty, s };\n    const worldTransform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + s.toFixed(4) + ')';\n\n    // preview\n    let pv = {};\n    if (this.state.previewOpen && data.groups[this.state.previewGroupIdx]) {\n      const g = data.groups[this.state.previewGroupIdx];\n      const p = g.projects[this.state.previewProjIdx];\n      if (p) {\n        const st = this.STATUS[p.status] || this.STATUS['in-progress'];\n        const stack = Array.isArray(p.stack) ? p.stack : [];\n        pv = {\n          pvName: p.name, pvGroup: g.name, pvBlurb: p.blurb || '',\n          pvDetail: p.detail || '', pvHasDetail: !!p.detail,\n          pvNext: p.next || '', pvHasNext: !!p.next,\n          pvStack: stack, pvHasStack: stack.length > 0,\n          pvLink: p.link || '', pvHasLink: !!p.link, pvNoLink: !p.link,\n          pvStatusColor: st.c, pvStatusTint: st.t, pvStatusLabel: st.l,\n          pvSlotId: 'img-' + p.id,\n        };\n      }\n    }\n\n    const focused = gs.find(g => g.id === focusedId);\n\n    return {\n      desktop: !this.state.isMobile,\n      isMobile: this.state.isMobile,\n      groups, projectNodes, lines,\n      worldTransform, worldW: this.WORLD.w, worldH: this.WORLD.h,\n      showStatus,\n      brandTitle: (data.brand && data.brand.title) || 'The DGTL Project Network',\n      brandSubtitle: (data.brand && data.brand.subtitle) || \"Everything we've built, mapped as one constellation.\",\n      showHero: view === 'galaxy' && !this.state.isMobile,\n      inGroup: view === 'group' && !this.state.isMobile,\n      focusedName: focused ? focused.name : '',\n      focusedTagline: focused ? (focused.tagline || '') : '',\n      previewOpen: this.state.previewOpen,\n      adminOpen: this.state.adminOpen,\n      inquiryOpen: this.state.inquiryOpen,\n      inquirySent: this.state.inquirySent,\n      inquiryNotSent: !this.state.inquirySent,\n      adminGroups: groups,\n      // handlers / refs\n      setCanvas: this.setCanvas,\n      onViewportClick: this.onViewportClick,\n      onGroupClick: this.onGroupClick,\n      onProjectClick: this.onProjectClick,\n      backToGalaxy: this.backToGalaxy,\n      closePreview: this.closePreview,\n      stop: this.stop,\n      toggleAdmin: this.toggleAdmin,\n      openInquiry: this.openInquiry,\n      closeInquiry: this.closeInquiry,\n      submitInquiry: this.submitInquiry,\n      onFieldInput: this.onFieldInput,\n      onAdminAction: this.onAdminAction,\n      exportData: this.exportData,\n      revertToFile: this.revertToFile,\n      ...pv,\n    };\n  }\n\n  _projMeta(p, gi, pi, showStatus) {\n    const st = this.STATUS[p.status] || this.STATUS['in-progress'];\n    return {\n      gi, pi, id: p.id, name: p.name || 'Untitled', blurb: p.blurb || '',\n      status: p.status || 'in-progress',\n      statusColor: st.c, statusLabel: st.l,\n      detail: p.detail || '', next: p.next || '', link: p.link || '',\n    };\n  }\n\n  _clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }\n  _alpha(hex, a) {\n    const h = (hex || '#F0CF50').replace('#', '');\n    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);\n    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
